[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "end-to-end-mlops-pipeline"
version = "0.1.0"
description = "A reproducible Azure Machine Learning lifecycle learning project."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "azure-ai-ml==1.34.1",
  "azure-identity==1.23.0",
  "cryptography==49.0.0",
  "mlflow==3.15.1",
  "msal==1.38.0",
  "pandas==2.1.4",
  "scikit-learn==1.8.0",
  "skops==0.14.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["components*", "deployment*", "pipelines*", "scripts*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = ["artifacts", "mlruns", "data/raw"]
