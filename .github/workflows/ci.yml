name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src pipelines components deployment scripts
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Azure SDK import
        run: python -c "from azure.ai.ml import MLClient; print(MLClient)"

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.9.0"
      - name: Audit runtime dependencies
        run: >-
          python -m pip_audit
          --strict
          --requirement requirements.txt
          --ignore-vuln PYSEC-2026-3552

  container:
    name: Container build and security
    runs-on: ubuntu-latest
    needs:
      - quality
      - dependency-security
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: >-
          docker build
          --file docker/Dockerfile
          --tag mlops-pipeline:${{ github.sha }}
          .
      - name: Verify non-root runtime and imports
        run: |
          docker run --rm --entrypoint python "mlops-pipeline:${GITHUB_SHA}" \
            -c "import os; from azure.ai.ml import MLClient; import mlflow; assert os.getuid() != 0; print(MLClient, mlflow.__version__)"
      - name: Scan container for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: mlops-pipeline:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
